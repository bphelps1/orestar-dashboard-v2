name: Build Atomic Balance Evidence
run-name: 'Atomic balance evidence: ${{ inputs.effort_id }}'

# Establish the first exact-ID observation that is safe to use with a paired
# ORESTAR balance.  Summary capture and coverage diff intentionally share one
# checkout and one hydrated transaction snapshot.  There is no second pull
# between them: if the snapshot cannot stay fixed, the batch refuses to publish
# a claim rather than silently comparing two different points in time.

on:
  workflow_dispatch:
    inputs:
      effort_id:
        description: "Approved effort ID from .github/atomic-evidence-policy.json"
        required: true
        type: string
      filer_ids:
        description: "Space-separated physical filer IDs, or blank for actionable unanchored scopes"
        required: false
        default: ""
        type: string
      max_passes:
        description: "Total capture/exact passes: 1 requires an explicit policy-authorized scope"
        required: false
        default: "3"
        type: choice
        options:
          - "3"
          - "1"
      max_scopes:
        description: "Maximum complete canonical scopes in this batch"
        required: false
        default: "12"
        type: string
      chain_index:
        description: "Internal: which bounded batch of this evidence chain is running"
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  # Keep every request. A shared fixed key retains only one pending run and
  # can silently evict an older handoff; await-orestar provides serialization.
  group: atomic-balance-evidence-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    # Coordination/setup plus at most three real summary/exact passes. Each
    # exact collector has a 70-minute soft budget; six hours is the hard cap.
    timeout-minutes: 360
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: exports
      PLAN_PATH: /tmp/atomic-balance-plan.json
      READY_PATH: /tmp/atomic-balance-ready.json
      REPORT_PATH: /tmp/atomic-balance-report.json
      ORESTAR_SEARCH_BUDGET_PATH: /tmp/atomic-search-budget.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for other ORESTAR jobs
        uses: ./.github/actions/await-orestar
        with:
          fail-on-timeout: "true"

      - name: Refresh branch after coordination wait
        run: |
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          git reset --hard FETCH_HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Admit this attempt against the persistent effort limit
        id: effort
        env:
          GH_TOKEN: ${{ github.token }}
          EFFORT_ID: ${{ inputs.effort_id }}
          MAX_PASSES: ${{ inputs.max_passes || '3' }}
          REQUESTED_FILER_IDS: ${{ inputs.filer_ids }}
        run: |
          case "$REQUESTED_FILER_IDS" in
            *$'\n'*|*$'\r'*) echo "::error::Filer IDs must be one space-separated line."; exit 1 ;;
          esac
          read -r -a REQUESTED <<< "$REQUESTED_FILER_IDS"
          for ID in "${REQUESTED[@]}"; do
            if [[ ! "$ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Filer IDs must be positive numeric strings."
              exit 1
            fi
          done
          python scripts/atomic_evidence_effort.py admit --effort-id "$EFFORT_ID" \
            --max-passes "$MAX_PASSES" --filer-ids "${REQUESTED[@]}"

      - name: Initialize shared exact search budget
        run: |
          python scraper/search_budget.py init \
            --path "$ORESTAR_SEARCH_BUDGET_PATH" \
            --limit "${{ steps.effort.outputs.max_searches }}"

      - name: Hydrate one immutable evidence window
        id: state
        run: python scripts/pipeline_state.py pull transactions summaries auxiliary

      - name: Plan complete canonical scopes
        id: plan
        env:
          REQUESTED_FILER_IDS: ${{ inputs.filer_ids }}
          MAX_SCOPES: ${{ inputs.max_scopes }}
          POLICY_MAX_SCOPES: ${{ steps.effort.outputs.max_scopes }}
          MAX_SEARCHES: ${{ steps.effort.outputs.max_searches }}
          EXCLUDED_FILER_IDS: ${{ steps.effort.outputs.excluded_filer_ids }}
          MAX_PASSES: ${{ steps.effort.outputs.max_passes }}
          SINGLE_PASS_FILER_IDS: ${{ steps.effort.outputs.single_pass_filer_ids }}
        run: |
          case "$MAX_SCOPES" in
            ''|*[!0-9]*) echo "::error::Invalid scope limit."; exit 1 ;;
          esac
          if [ "$MAX_SCOPES" -gt "$POLICY_MAX_SCOPES" ]; then
            MAX_SCOPES="$POLICY_MAX_SCOPES"
          fi
          read -r -a EXCLUDED <<< "$EXCLUDED_FILER_IDS"
          read -r -a SINGLE_PASS <<< "$SINGLE_PASS_FILER_IDS"
          ARGS=(plan --max-scopes "$MAX_SCOPES" --max-searches "$MAX_SEARCHES"
            --max-passes "$MAX_PASSES" --single-pass-filer-ids "${SINGLE_PASS[@]}"
            --search-cost-hints .github/atomic-search-costs.json
            --exclude-filer-ids "${EXCLUDED[@]}" --output "$PLAN_PATH")
          if [ -n "$REQUESTED_FILER_IDS" ]; then
            read -r -a REQUESTED <<< "$REQUESTED_FILER_IDS"
            ARGS+=(--filer-ids "${REQUESTED[@]}")
          fi
          python scraper/atomic_balance_evidence.py "${ARGS[@]}"
          FILER_IDS=$(jq -r '[.scopes[].filer_ids[]] | unique | join(" ")' "$PLAN_PATH")
          echo "filer_ids=$FILER_IDS" >> "$GITHUB_OUTPUT"
          echo "selected_scopes=$(jq -r '.selected_scope_count' "$PLAN_PATH")" >> "$GITHUB_OUTPUT"
          echo "remaining_scopes=$(jq -r '.remaining_scope_count' "$PLAN_PATH")" >> "$GITHUB_OUTPUT"
          echo "snapshot_id=$(jq -r '.transaction_snapshot_id' "$PLAN_PATH")" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser + system dependencies
        if: steps.plan.outputs.filer_ids != ''
        timeout-minutes: 25
        run: bash scripts/install_playwright.sh

      - name: Install Xvfb (virtual display for headed browser)
        if: steps.plan.outputs.filer_ids != ''
        run: sudo apt-get install -y xvfb

      - name: Capture fresh summaries for planned scopes
        id: summaries
        if: steps.plan.outputs.filer_ids != ''
        continue-on-error: true
        env:
          FILER_IDS: ${{ steps.plan.outputs.filer_ids }}
        run: |
          read -r -a IDS <<< "$FILER_IDS"
          xvfb-run --auto-servernum python scraper/fetch_earliest_balances.py \
            --filer-ids "${IDS[@]}" --force --current-only

      - name: Select scopes paired inside this window
        id: ready
        if: always() && steps.plan.outcome == 'success' && steps.plan.outputs.filer_ids != ''
        run: |
          python scraper/atomic_balance_evidence.py ready \
            --plan "$PLAN_PATH" --output "$READY_PATH"
          FILER_IDS=$(jq -r '[.scopes[].filer_ids[]] | unique | join(" ")' "$READY_PATH")
          echo "filer_ids=$FILER_IDS" >> "$GITHUB_OUTPUT"
          echo "ready_scopes=$(jq -r '.ready_scope_count' "$READY_PATH")" >> "$GITHUB_OUTPUT"
          echo "rejected_scopes=$(jq -r '.rejected_scope_count' "$READY_PATH")" >> "$GITHUB_OUTPUT"
          echo "end_date=$(jq -r '.end_date' "$READY_PATH")" >> "$GITHUB_OUTPUT"

      - name: Diff exactly the freshly paired scopes
        id: diff
        if: >-
          always() && steps.summaries.outcome == 'success' &&
          steps.ready.outcome == 'success' &&
          steps.ready.outputs.filer_ids != ''
        continue-on-error: true
        env:
          END_DATE: ${{ steps.ready.outputs.end_date }}
        run: |
          xvfb-run --auto-servernum python scraper/diff_coverage.py \
            --scope-plan "$READY_PATH" --recheck --start-year 2006 \
            --end-date "$END_DATE" --max-minutes 70

      - name: Verify atomic exact evidence
        id: verify
        if: always() && steps.ready.outcome == 'success'
        run: |
          python scraper/atomic_balance_evidence.py verify \
            --plan "$READY_PATH" --output "$REPORT_PATH"
          echo "certified_scopes=$(jq -r '.certified_scope_count' "$REPORT_PATH")" >> "$GITHUB_OUTPUT"
          echo "certified_filers=$(jq -r '.certified_filer_count' "$REPORT_PATH")" >> "$GITHUB_OUTPUT"
          echo "blocked_filers=$(jq -r '.blocked_filer_count' "$REPORT_PATH")" >> "$GITHUB_OUTPUT"
          echo "missing_ids=$(jq -r '.missing_id_count' "$REPORT_PATH")" >> "$GITHUB_OUTPUT"
          echo "surplus_ids=$(jq -r '.surplus_id_count' "$REPORT_PATH")" >> "$GITHUB_OUTPUT"

      # Both evidence profiles advance in one manifest generation. A partial
      # summary or diff is still truthful state; the validator simply refuses
      # to call its incomplete scope certified.
      - name: Publish atomic evidence state
        id: publish
        if: always() && steps.state.outcome == 'success' && steps.verify.outcome == 'success'
        run: python scripts/pipeline_state.py push summaries auxiliary

      - name: Re-aggregate from durable evidence
        id: aggregate
        if: always() && steps.publish.outcome == 'success'
        run: python scraper/process.py

      - name: Stabilize captured cash against fresh exact evidence
        id: stabilize
        if: >-
          always() && !cancelled() && steps.aggregate.outcome == 'success' &&
          steps.summaries.outcome == 'success' &&
          steps.diff.outcome == 'success' &&
          steps.ready.outputs.ready_scopes == steps.plan.outputs.selected_scopes &&
          steps.verify.outputs.certified_scopes == steps.plan.outputs.selected_scopes &&
          steps.plan.outputs.filer_ids != ''
        run: |
          xvfb-run --auto-servernum python scraper/stabilize_atomic_balances.py \
            --plan "$READY_PATH" --max-passes "${{ steps.effort.outputs.max_passes }}"

      # If a prior run published both profiles but died during process.py, its
      # exact rows may make this plan empty. Re-running must still be able to
      # finish projecting that already-durable evidence into the app caches.
      - name: Recover aggregation when the atomic plan is empty
        id: recover_aggregate
        if: >-
          steps.plan.outcome == 'success' &&
          steps.plan.outputs.filer_ids == ''
        run: python scraper/process.py

      - name: Replan after recovering empty-plan aggregation
        id: recovery_plan
        if: steps.recover_aggregate.outcome == 'success'
        env:
          MAX_SCOPES: ${{ steps.effort.outputs.max_scopes }}
          MAX_SEARCHES: ${{ steps.effort.outputs.max_searches }}
          EXCLUDED_FILER_IDS: ${{ steps.effort.outputs.excluded_filer_ids }}
          MAX_PASSES: ${{ steps.effort.outputs.max_passes }}
          SINGLE_PASS_FILER_IDS: ${{ steps.effort.outputs.single_pass_filer_ids }}
        run: |
          read -r -a EXCLUDED <<< "$EXCLUDED_FILER_IDS"
          read -r -a SINGLE_PASS <<< "$SINGLE_PASS_FILER_IDS"
          python scraper/atomic_balance_evidence.py plan \
            --max-scopes "$MAX_SCOPES" --max-searches "$MAX_SEARCHES" \
            --max-passes "$MAX_PASSES" --single-pass-filer-ids "${SINGLE_PASS[@]}" \
            --search-cost-hints .github/atomic-search-costs.json \
            --exclude-filer-ids "${EXCLUDED[@]}" --output /tmp/atomic-recovery-plan.json
          SELECTED=$(jq -r '.selected_scope_count' /tmp/atomic-recovery-plan.json)
          echo "selected_scopes=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "Recovered aggregation exposed $SELECTED scopes needing another real capture window."

      - name: Enforce truthful terminal status
        if: always() && steps.plan.outputs.filer_ids != ''
        run: |
          if [ "${{ steps.summaries.outcome }}" != "success" ]; then
            echo "::error::Summary capture failed; exact coverage was not started on the refusing runner."
            exit 1
          fi
          if [ "${{ steps.ready.outputs.ready_scopes }}" != "${{ steps.plan.outputs.selected_scopes }}" ]; then
            echo "::error::Not every selected scope produced a fresh paired summary."
            exit 1
          fi
          if [ "${{ steps.diff.outcome }}" != "success" ]; then
            echo "::error::At least one exact scope was unusable; no partial scope was certified."
            exit 1
          fi
          if [ "${{ steps.publish.outcome }}" != "success" ]; then
            echo "::error::Atomic summary/diff state was not published."
            exit 1
          fi
          if [ "${{ steps.aggregate.outcome }}" != "success" ]; then
            echo "::error::Atomic evidence was saved, but final aggregation failed."
            exit 1
          fi
          if [ "${{ steps.verify.outputs.certified_scopes }}" != "${{ steps.plan.outputs.selected_scopes }}" ]; then
            echo "::error::Not every selected scope produced certifiable same-window evidence."
            exit 1
          fi
          if [ "${{ steps.stabilize.outcome }}" != "success" ]; then
            echo "::error::Captured cash did not settle against the freshly projected exact evidence."
            exit 1
          fi
          echo "Atomic batch certified ${{ steps.verify.outputs.certified_scopes }} complete scopes."

      - name: Continue bounded evidence chain
        if: >-
          success() && !cancelled() && inputs.filer_ids == '' &&
          steps.effort.outputs.max_passes == '3' &&
          ((steps.verify.outputs.certified_scopes != '' &&
          steps.verify.outputs.certified_scopes != '0') ||
          (steps.recovery_plan.outputs.selected_scopes != '' &&
          steps.recovery_plan.outputs.selected_scopes != '0'))
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_CHAIN: ${{ steps.effort.outputs.max_attempts }}
          MAX_SCOPES: ${{ steps.effort.outputs.max_scopes }}
          CHAIN_INDEX: ${{ inputs.chain_index }}
          EFFORT_ID: ${{ steps.effort.outputs.effort_id }}
        run: |
          python scripts/atomic_evidence_effort.py handoff \
            --effort-id "$EFFORT_ID" > /tmp/atomic-handoff.json
          if [ "$(jq -r '.can_dispatch' /tmp/atomic-handoff.json)" != "true" ]; then
            echo "The persistent effort limit is exhausted or disabled; stopping."
            exit 0
          fi
          CHAIN="${CHAIN_INDEX:-1}"
          case "$CHAIN" in
            ''|*[!0-9]*) echo "::error::Invalid atomic chain index."; exit 1 ;;
          esac
          if [ "$CHAIN" -ge "$MAX_CHAIN" ]; then
            echo "Reached the $MAX_CHAIN-batch evidence-chain limit; yielding the ORESTAR lane."
            exit 0
          fi
          if [ "${{ steps.recovery_plan.outputs.selected_scopes || '0' }}" -gt 0 ]; then
            echo "Recovered aggregation left ${{ steps.recovery_plan.outputs.selected_scopes }} scopes to capture; queueing atomic batch $((CHAIN + 1))."
          else
            echo "Certified ${{ steps.verify.outputs.certified_scopes }} scopes; queueing atomic batch $((CHAIN + 1))."
          fi
          # One dispatch attempt is deliberate. Retrying an ambiguous accepted
          # request can create two children for the same logical batch.
          gh workflow run atomic-balance-evidence.yml \
            --ref "$GITHUB_REF_NAME" \
            -f effort_id="$EFFORT_ID" \
            -f filer_ids= \
            -f max_passes=3 \
            -f max_scopes="$MAX_SCOPES" \
            -f chain_index="$((CHAIN + 1))"
